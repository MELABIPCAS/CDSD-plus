# Reptile Meta-Learning Configuration for Speaker-Independent ASR
# 基于paraformer_sanm_50e_16d_2048_256.yaml，使用元学习方法学习说话人无关特征

# network architecture
model: Paraformer
model_conf:
    ctc_weight: 0.0
    lsm_weight: 0.1
    length_normalized_loss: true
    predictor_weight: 1.0
    predictor_bias: 1
    sampling_ratio: 0.75

# encoder - SANM architecture matching pretrained model
encoder: SANMEncoder
encoder_conf:
    output_size: 512
    attention_heads: 4
    linear_units: 2048
    num_blocks: 50
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: pe
    pos_enc_class: SinusoidalPositionEncoder
    normalize_before: true
    kernel_size: 11
    sanm_shfit: 0
    selfattention_layer_type: sanm

# decoder - SANM architecture matching pretrained model
decoder: ParaformerSANMDecoder
decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 16
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.1
    src_attention_dropout_rate: 0.1
    att_layer_num: 16
    kernel_size: 11
    sanm_shfit: 0

# predictor - matching pretrained model
predictor: CifPredictorV2
predictor_conf:
    idim: 512
    threshold: 1.0
    l_order: 1
    r_order: 1
    tail_threshold: 0.45

# frontend related - matching pretrained model
frontend: WavFrontend
frontend_conf:
    fs: 16000
    window: hamming
    n_mels: 80
    frame_length: 25
    frame_shift: 10
    lfr_m: 7
    lfr_n: 6

# specaug - matching pretrained model
specaug: SpecAugLFR
specaug_conf:
    apply_time_warp: false
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 30
    lfr_rate: 6
    num_freq_mask: 1
    apply_time_mask: true
    time_mask_width_range:
    - 0
    - 12
    num_time_mask: 1

# Reptile Meta-Learning Training Configuration
train_conf:
  accum_grad: 4
  grad_clip: 5
  max_epoch: 640 
  keep_nbest_models: 10
  avg_nbest_model: 10
  log_interval: 50
  # Reptile specific parameters
  trainer_class: ReptileTrainer
  reptile_inner_lr: 0.01  # 内循环学习率
  reptile_inner_steps: 2  # 内循环步数（从1增加到2，提升元学习效果）
  reptile_alpha: 1.0  # Reptile更新权重
  reptile_speakers_per_batch: 16 # 每个meta-batch的说话人数量（67个说话人，16较合理）
  reptile_samples_per_speaker: 64 # 每个说话人的样本数（从16增加到32，每人有1000条数据，可支持更多样本）

optim: adam
optim_conf:
   lr: 0.0005
scheduler: warmuplr
scheduler_conf:
   warmup_steps: 30000

# 使用AudioDatasetSpeaker以获取speaker_ids（仅用于分组，不输入模型）
dataset: AudioDatasetSpeaker
dataset_conf:
    index_ds: IndexDSJsonl
    batch_sampler: EspnetStyleBatchSampler
    batch_type: length
    batch_size: 10000
    max_token_length: 1200
    buffer_size: 1024
    shuffle: True
    num_workers: 4
    preprocessor_speech: SpeechPreprocessSpeedPerturb
    preprocessor_speech_conf:
      speed_perturb: [0.9, 1.0, 1.1]
    # 说话人ID相关配置（仅用于数据分组）
    speaker_id_prefix: 4  # 从key前4个字符提取说话人ID

tokenizer: CharTokenizer
tokenizer_conf:
  unk_symbol: <unk>
  split_with_space: true

input_size: 560
ctc_conf:
    dropout_rate: 0.0
    ctc_type: builtin
    reduce: true
    ignore_nan_grad: true
normalize: null

# pretrained model path
init_param: "/home/zhaoxr/.cache/modelscope/hub/iic/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch/model.pt"

